<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תחנת תצפית מדוזות — Israel Aquarium</title>
  <style>
    @font-face {
      font-family: 'Abraham';
      src: url('Abraham-Regular.otf') format('opentype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Abraham';
      src: url('Abraham-Bold.otf') format('opentype');
      font-weight: 700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
    }

    canvas {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script src="sketch.js"></script>
</body>
</html>
