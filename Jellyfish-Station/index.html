<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>תחנת תצפית מדוזות — Israel Aquarium</title>
  <style>
    @font-face {
      font-family: 'Abraham';
      src: url('Abraham-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Abraham';
      src: url('Abraham-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 56.25vw !important;
      max-height: 100vh !important;
      max-width: 177.78vh !important;
      margin: auto;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
